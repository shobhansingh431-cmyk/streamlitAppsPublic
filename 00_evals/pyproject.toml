[project]
name = "ragas-eval-demo"
version = "0.1.0"
description = "Public RAGAS eval demo — standalone, no AWS/backend dependency"
readme = "README.md"
requires-python = ">=3.10"
# Mirrors requirements.txt exactly — that file is what Streamlit
# Community Cloud actually installs from; this pyproject.toml exists
# so `uv sync` works for local dev/testing.
dependencies = [
    "streamlit>=1.39.0",
    "pandas>=2.2.0",
    "ragas>=0.2.8",
    "datasets>=3.1.0",
    # ragas's llms/base.py unconditionally imports
    # langchain_community.chat_models.vertexai at module load time.
    # langchain-community 0.4.x dropped that module entirely, and
    # versions before 0.3.x cap numpy<2.0. 0.3.31 is the last release
    # confirmed to still have chat_models/vertexai.py while declaring
    # numpy>=2.1.0 for python_version >= "3.13".
    "langchain-community==0.3.31",
    # Wraps Groq's OpenAI-compatible endpoint as RAGAS's judge LLM.
    "langchain-openai>=0.2.0",
]
